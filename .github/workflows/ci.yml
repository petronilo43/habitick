# Runs on every push and pull request: the code must pass the linter, the tests
# (including the database rules), the browser tests and a production build.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The browser tests bring their own stand-in for Supabase, so they need no secrets.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # If a browser test fails, its report (with screenshots) can be downloaded from the run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
